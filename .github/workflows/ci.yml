name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-lint:
    name: python · ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  python-fast:
    name: python · helpers (no AP)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-test.txt
      - run: pytest tests/ --cov --cov-report=term

  python-world:
    name: python · AP world tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Clone Archipelago @0.6.7
        run: git clone --depth 1 --branch 0.6.7 https://github.com/ArchipelagoMW/Archipelago _ap
      - name: Install Archipelago deps
        run: cd _ap && python ModuleUpdate.py --yes --force
      - name: Install test tooling
        run: pip install -r requirements-test.txt
      - name: Symlink world into the AP clone
        run: ln -s "$GITHUB_WORKSPACE/apworld/sokopelago" _ap/worlds/sokopelago
      - name: World tests (WorldTestBase — generation, fill, beatability)
        run: cd _ap && python -m pytest worlds/sokopelago/test/ -n auto --cov=worlds.sokopelago --cov-report=term
      - name: mypy --strict (advisory)
        continue-on-error: true
        run: cd _ap && mypy --strict --follow-imports=silent --ignore-missing-imports worlds/sokopelago

  client-lint:
    name: client · eslint/prettier/tsc
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  client-test:
    name: client · vitest + coverage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run coverage

  # --- Gated delivery -------------------------------------------------------
  # These run only after every check above passes (needs:), so a red pipeline can
  # never deploy the site or publish a release. Branch/tag is selected via `if:`.

  deploy-pages:
    name: deploy · GitHub Pages
    needs: [python-lint, python-fast, python-world, client-lint, client-test]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client
      - uses: actions/configure-pages@v6
        with:
          enablement: true # turn Pages on (Actions source) via the API — no manual setup
      - uses: actions/upload-pages-artifact@v5
        with:
          path: client/dist
      - id: deployment
        uses: actions/deploy-pages@v5

  release-apworld:
    name: release · apworld
    needs: [python-lint, python-fast, python-world, client-lint, client-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Package sokopelago.apworld
        # Ship the package + bundled data; drop tests and caches (not needed to play).
        run: cd apworld && zip -r ../sokopelago.apworld sokopelago -x 'sokopelago/test/*' '*/__pycache__/*'
      - name: Attach to the release
        uses: softprops/action-gh-release@v3
        with:
          files: sokopelago.apworld
          generate_release_notes: true
          prerelease: true # 0.x is alpha — see the in-app disclaimer
