name: Deploy client to Pages

# Builds the browser client and publishes it to GitHub Pages. One-time setup in the repo:
# Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# The built site is base-relative (vite base "./"), so it works under the project-site
# subpath (https://<user>.github.io/sokopelago/).

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "apworld/sokopelago/data/**" # bundled manifests the client serves
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deploy at a time; let a newer push supersede an older run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
