name: Release apworld

# On a version tag, package the world as sokopelago.apworld (a zip whose root holds the
# sokopelago/ package dir) and attach it to the GitHub Release. Players install it via the
# Archipelago launcher's "Install APWorld" button.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package sokopelago.apworld
        # Ship the package + bundled data; drop tests and caches (not needed to play).
        run: cd apworld && zip -r ../sokopelago.apworld sokopelago -x 'sokopelago/test/*' '*/__pycache__/*'
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: sokopelago.apworld
          generate_release_notes: true
