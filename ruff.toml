# Mirrors ArchipelagoMW/Archipelago's ruff.toml (0.6.7) so this world lints the
# same way AP core does. Keep the select/ignore sets in sync with upstream.
line-length = 120
indent-width = 4
target-version = "py311"

[lint]
select = ["B", "C", "E", "F", "W", "I", "N", "Q", "UP", "RET", "RSE", "RUF", "ISC", "PLC", "PLE", "PLW", "T20", "PERF"]
ignore = [
    "B011",  # In AP, the use of assert False is essential because we optimise out these statements for release builds.
    "C901",  # Author disagrees with limiting branch complexity
    "N818",  # Author agrees with this rule, but Core AP violates this and changing it would be a hassle.
    "PLC0415",  # In AP, we consider local imports totally fine & necessary
    "PLC1802",  # Author agrees with this rule, but it literally changes the functionality of the code, which is unsafe.
    "PLC1901",  # This is just not equivalent
    "PLE1141",  # Gives false positives when the dict keys are tuples, but does not mention this in the suggested fix.
    "UP015",  # Explicit is better than implicit, so we'd prefer to keep "r" in open() calls.
]

[lint.per-file-ignores]
# Items/Locations/Options are AP's conventional world module names (imported as
# .Items/.Locations/.Options); keep them despite N999's lowercase-module rule.
"apworld/sokopelago/Items.py" = ["N999"]
"apworld/sokopelago/Locations.py" = ["N999"]
"apworld/sokopelago/Options.py" = ["N999"]
# Tests inject sys.path before importing the modules under test (E402), and the
# pure-helper imports are intentionally not at the package top.
"tests/*.py" = ["E402"]
# build_corpus is a CLI data-prep script — printing its result is intended.
"tools/*.py" = ["T201"]
# WorldTestBase subclasses set `options = {...}` (the AP world-test idiom); RUF012's
# ClassVar requirement doesn't apply to this convention.
"apworld/sokopelago/test/*.py" = ["RUF012"]
