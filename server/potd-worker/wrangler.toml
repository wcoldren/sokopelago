# Sokopelago Puzzle-of-the-Day ratings Worker. See README.md for the one-time setup commands.
name = "sokopelago-potd"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# D1 (SQLite) binding. Create the database with `wrangler d1 create sokopelago-potd` and paste
# the printed database_id below (it is not a secret). Apply src/schema.sql with `wrangler d1
# execute` (see README). The Worker reads this binding as env.DB.
[[d1_databases]]
binding = "DB"
database_name = "sokopelago-potd"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Browser CORS allow-list: the exact Pages origin(s), comma-separated. Update to your Pages URL
# (and any custom domain). Not a secret. The account id + API token used to deploy are supplied
# out-of-band (CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN), never committed here.
[vars]
ALLOWED_ORIGINS = "https://USERNAME.github.io"
