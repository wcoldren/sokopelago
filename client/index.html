<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sokopelago — local play</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #1a1a1f;
        color: #e6e6ea;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        padding: 1.5rem;
      }
      header { text-align: center; }
      h1 { margin: 0 0 0.25rem; font-size: 1.4rem; }
      .toolbar { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; justify-content: center; }
      select, button {
        font: inherit;
        background: #2a2a33;
        color: inherit;
        border: 1px solid #44444f;
        border-radius: 6px;
        padding: 0.35rem 0.6rem;
      }
      button { cursor: pointer; }
      #board { background: #111; border-radius: 8px; image-rendering: pixelated; }
      #status { min-height: 1.4rem; font-weight: 600; }
      #status.win { color: #6ee787; }
      .hint { opacity: 0.6; font-size: 0.85rem; }
    </style>
  </head>
  <body>
    <header>
      <h1>Sokopelago</h1>
      <div class="hint">Phase 0 — local Sokoban, no Archipelago connection</div>
    </header>

    <div class="toolbar">
      <label>Level: <select id="level-select"></select></label>
      <button id="restart-btn" title="Restart (R)">Restart</button>
    </div>

    <canvas id="board" width="640" height="480"></canvas>

    <div id="status"></div>
    <div class="hint">Move: arrow keys or WASD &nbsp;·&nbsp; Restart: R</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
